<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Module — Thermax Water &amp; Waste</title>
<style>
/* ============================================================ TOKENS */
:root{
  --navy:#1E2A3A; --navy-2:#263449; --navy-3:#33455E;
  --accent:#0066CC; --brand-blue:#4DA3FF;
  --canvas:#F4F6F8; --card:#FFFFFF; --line:#E2E8F0; --band:#FAFBFC; --parent:#E8EDF3;
  --ink:#0F1728; --ink-2:#475569; --ink-3:#64748B;
  --cream:#FEF9E7; --entry:#FFFCF0;
  --ok:#16A34A; --ok-bg:#DCFCE7; --warn:#B45309; --warn-bg:#FEF3C7;
  --err:#DC2626; --err-bg:#FEE2E2;
  --sidebar-w:264px;
  --r:10px;
  --shadow:0 1px 2px rgba(15,23,40,.04), 0 4px 16px rgba(15,23,40,.06);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--canvas); color:var(--ink);
  font:14px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}

/* ============================================================ SHELL */
.app{display:flex; min-height:100vh}

/* ---- sidebar */
.side{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:var(--navy); color:#fff; display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.side-head{padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,.09)}
.wordmark{font-size:15px; font-weight:700; letter-spacing:.02em}
.wordmark span{color:var(--brand-blue)}
.side-head .sub{margin-top:5px; font-size:11px; color:#94A3B8; letter-spacing:.06em; text-transform:uppercase}

.side-scope{padding:16px 20px; border-bottom:1px solid rgba(255,255,255,.09)}
.side-scope .lbl{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#7C8BA1}
.side-scope .ws{margin-top:6px; font-size:13px; font-weight:600; line-height:1.35}
.side-scope .meta{margin-top:8px; font-size:11px; color:#94A3B8}

.nav{padding:16px 12px; flex:1; overflow-y:auto}
.nav-lbl{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:#7C8BA1; padding:0 8px 10px}
.rpt{
  width:100%; text-align:left; background:transparent; border:0; color:#CBD5E1;
  padding:11px 12px; border-radius:8px; display:flex; gap:11px; align-items:flex-start;
  transition:background .15s, color .15s; margin-bottom:2px;
}
.rpt:hover:not(:disabled){background:var(--navy-2); color:#fff}
.rpt[aria-current="true"]{background:var(--navy-3); color:#fff; box-shadow:inset 3px 0 0 var(--brand-blue)}
.rpt:disabled{opacity:.42; cursor:not-allowed}
.rpt .ico{flex:0 0 16px; margin-top:1px; opacity:.85}
.rpt .nm{font-size:13px; font-weight:600; display:block}
.rpt .ds{font-size:11px; color:#94A3B8; display:block; margin-top:2px; line-height:1.35}
.rpt[aria-current="true"] .ds{color:#B6C4D6}
.pill{
  font-size:9px; letter-spacing:.06em; text-transform:uppercase; font-weight:700;
  background:rgba(255,255,255,.12); color:#CBD5E1; padding:2px 6px; border-radius:4px; margin-left:auto;
}
.side-foot{padding:14px 20px; border-top:1px solid rgba(255,255,255,.09); font-size:11px; color:#7C8BA1}

/* ---- main */
.main{flex:1; min-width:0; display:flex; flex-direction:column}
.top{
  background:var(--card); border-bottom:1px solid var(--line);
  padding:18px 32px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
}
.top h1{margin:0; font-size:17px; font-weight:700; letter-spacing:-.01em}
.top .crumb{font-size:12px; color:var(--ink-3); margin-top:3px}
.status{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-2)}
.dot{width:7px; height:7px; border-radius:50%; background:var(--ink-3); flex:0 0 7px}
.dot.live{background:var(--ok); box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.dot.bad{background:var(--err); box-shadow:0 0 0 3px rgba(220,38,38,.15)}
.dot.busy{background:var(--accent); animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.stage{padding:32px; flex:1; display:flex; justify-content:center}
.stage-inner{width:100%; max-width:760px}

/* ---- states */
.empty{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:64px 40px; text-align:center; box-shadow:var(--shadow);
}
.empty .mark{
  width:52px; height:52px; margin:0 auto 18px; border-radius:12px;
  background:var(--parent); display:grid; place-items:center; color:var(--navy);
}
.empty h2{margin:0 0 8px; font-size:16px; font-weight:700}
.empty p{margin:0 auto; max-width:380px; color:var(--ink-2); font-size:13px}

.panel{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden}
.panel-head{padding:22px 26px 20px; border-bottom:1px solid var(--line)}
.panel-head .eyebrow{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:700}
.panel-head h2{margin:7px 0 6px; font-size:19px; font-weight:700; letter-spacing:-.01em}
.panel-head p{margin:0; color:var(--ink-2); font-size:13px; max-width:56ch}
.panel-body{padding:24px 26px}

/* ---- window card: the signature element */
.win{
  border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--band);
}
.win-top{
  display:flex; align-items:baseline; gap:10px; padding:14px 18px;
  border-bottom:1px solid var(--line); background:var(--card);
}
.win-top .k{font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
.win-top .v{font-size:15px; font-weight:700; letter-spacing:-.01em}
.win-top .badge{
  margin-left:auto; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
  background:var(--parent); color:var(--navy);
}
/* seven-day rail */
.rail{display:grid; grid-template-columns:repeat(7,1fr); gap:0; padding:16px 18px 6px}
.day{text-align:center; position:relative}
.day .dow{font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
.day .num{
  margin:6px auto 0; width:30px; height:30px; border-radius:50%; display:grid; place-items:center;
  font-size:12px; font-weight:600; color:var(--ink-3); background:transparent; border:1px solid transparent;
}
.day.inwin .num{background:#DBEAFE; color:#1D4ED8}
.day.today .num{background:var(--accent); color:#fff; border-color:var(--accent)}
.day.future .num{color:#B6C0CD}
.rail-cap{padding:2px 18px 14px; font-size:11px; color:var(--ink-3); text-align:center}

.note{
  margin-top:18px; border-left:3px solid var(--brand-blue); background:var(--cream);
  padding:13px 16px; border-radius:0 6px 6px 0; font-size:12.5px; color:#6B4A00; line-height:1.55;
}
.note strong{color:#513700}

.facts{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:8px; overflow:hidden; margin-top:18px}
.fact{background:var(--card); padding:13px 15px}
.fact .k{font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); font-weight:700}
.fact .v{margin-top:5px; font-size:19px; font-weight:700; letter-spacing:-.02em}
.fact .v small{font-size:12px; font-weight:600; color:var(--ink-3); letter-spacing:0}

.actions{display:flex; align-items:center; gap:14px; margin-top:24px; flex-wrap:wrap}
.btn{
  background:var(--accent); color:#fff; border:0; padding:12px 22px; border-radius:8px;
  font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:9px;
  transition:background .15s, transform .05s;
}
.btn:hover:not(:disabled){background:#0055AB}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{background:#9FB6CE; cursor:not-allowed}
.btn .sp{width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-size:12px; color:var(--ink-3)}

.field{margin-bottom:20px}
.flabel{display:block; font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3); font-weight:700; margin-bottom:7px}
.fsel,.fdate{
  font:inherit; font-size:13.5px; color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:7px; padding:10px 12px; width:100%;
}
.fsel:hover,.fdate:hover{border-color:#CBD5E1}
.range{display:flex; align-items:center; gap:11px}
.range .fdate{flex:1; min-width:0}
.dash{font-size:12px; color:var(--ink-3); flex:0 0 auto}
.fhint{margin-top:7px; font-size:12px; color:var(--ink-3)}
.ferr{margin-top:7px; font-size:12px; color:var(--err); font-weight:600}
.fail{border-left:3px solid var(--err); background:var(--err-bg); padding:13px 16px; border-radius:0 6px 6px 0; margin-top:18px; font-size:12.5px; color:#7F1D1D}
.fail code{background:rgba(0,0,0,.06); padding:1px 5px; border-radius:3px; font-size:11.5px}

/* ---- load / error screens */
.screen{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:56px 40px; text-align:center; box-shadow:var(--shadow)}
.screen .sp-lg{width:30px; height:30px; margin:0 auto 18px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite}
.screen h2{margin:0 0 8px; font-size:16px; font-weight:700}
.screen p{margin:0 auto 20px; max-width:420px; color:var(--ink-2); font-size:13px}
.screen .why{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; color:var(--err); background:var(--err-bg); display:inline-block; padding:7px 12px; border-radius:6px; margin-bottom:20px; max-width:100%; overflow-wrap:anywhere}
.btn-ghost{background:var(--card); color:var(--navy); border:1px solid var(--line); padding:10px 18px; border-radius:8px; font-size:13px; font-weight:600}
.btn-ghost:hover{background:var(--band); border-color:#CBD5E1}

@media (max-width:900px){
  .app{flex-direction:column}
  .side{width:100%; height:auto; position:static; flex:none}
  .nav{max-height:none}
  .stage{padding:20px}
  .top{padding:16px 20px}
}
</style>
</head>
<body>

<div class="app">
  <!-- ============================================ SIDEBAR -->
  <aside class="side">
    <div class="side-head">
      <div class="wordmark">venwiz<span>.</span></div>
      <div class="sub">Report module</div>
    </div>

    <div class="side-scope">
      <div class="lbl">Workspace</div>
      <div class="ws" id="wsName">Loading…</div>
      <div class="meta" id="wsMeta">&nbsp;</div>
    </div>

    <nav class="nav" id="nav" aria-label="Report types">
      <div class="nav-lbl">Reports</div>
      <!-- rendered from REPORT_TYPES -->
    </nav>

    <div class="side-foot">
      <div id="lastUpd">—</div>
    </div>
  </aside>

  <!-- ============================================ MAIN -->
  <div class="main">
    <header class="top">
      <div>
        <h1 id="topTitle">Reports</h1>
        <div class="crumb" id="topCrumb">Thermax — Water &amp; Waste</div>
      </div>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="dotText">Connecting…</span>
      </div>
    </header>

    <main class="stage"><div class="stage-inner" id="stage"></div></main>
  </div>
</div>

<script>
"use strict";
/* ================================================================
   CONFIG — Venwiz backend replaces these placeholders at inject time
   ================================================================ */
const ENDPOINTS = {
  // Quantitative dump. Called once on page load.
  dump:       "__MMT_DASHBOARD_DUMP_URL__",
  // Subjective info (comments / critical updates / issues) for a date range.
  // Called only when the user generates a report.
  subjective: "__MMT_SUBJECTIVE_URL__",
  // Reserved slot — currently the version history API: earliest/latest value
  // of each stat inside a date range. Called on Vendor visit report download,
  // for the Item Movement table.
  reserved:   "__MMT_RESERVED_URL__"
};

// Local review only. Serve this folder over http and flip to true.
//   python3 -m http.server 8000
const DEV = {
  on: false,
  dump:       "./thermax-dashboard-dump-api.json",
  subjective: "./Sample-data-Subjective-info.json"
};

const WEEK_STARTS_ON = 1;        // 1 = Monday
const DATE_PARAMS = { start:"startDate", end:"endDate" };   // subjective API query keys

/* ================================================================
   REPORT REGISTRY — add a type here and it appears in the sidebar
   ================================================================ */
const REPORT_TYPES = [
  {
    id:"weekly",
    name:"Weekly report",
    desc:"Current week, Monday to Sunday",
    enabled:true,
    icon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>',
    // no user input; the window is derived from today
    window: () => currentWeek(new Date()),
    render: renderWeekly
  },
  {
    id:"daily",
    name:"Vendor visit report",
    desc:"One vendor, over a chosen period",
    enabled:true,
    render: renderDaily,
    icon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>'
  },
  {
    id:"range",
    name:"Custom range",
    desc:"Pick your own start and end",
    enabled:false,
    badge:"Soon",
    icon:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h16M4 12l4-4M20 12l-4 4"/></svg>'
  }
];

/* ================================================================
   STATE
   ================================================================ */
const S = { dump:null, dumpErr:null, loading:true, active:null, busy:false, genErr:null,
            daily:{ vendorId:null, from:null, to:null } };

/* ================================================================
   WEEK MATH  (Mon 00:00:00 -> Sun 23:59:59, local time)
   ================================================================ */
function currentWeek(now){
  const d = new Date(now);
  const shift = (d.getDay() - WEEK_STARTS_ON + 7) % 7;   // days since Monday
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate() - shift, 0,0,0,0);
  const end   = new Date(start.getFullYear(), start.getMonth(), start.getDate()+6, 23,59,59,999);
  // data can only exist up to now, so the queried window stops at today
  const asOf  = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 23,59,59,999);
  const queryEnd = asOf < end ? asOf : end;
  return { start, end, queryEnd, partial: queryEnd < end, dayIndex: shift };
}
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const fmt = d => d ? `${pad(d.getDate())} ${MON[d.getMonth()]} ${d.getFullYear()}` : "—";
const fmtShort = d => d ? `${pad(d.getDate())} ${MON[d.getMonth()]}` : "—";

/* ================================================================
   DUMP MODEL  (DOM-free — mirrors build_weekly_report.py)
   ================================================================ */
const ALIASES = { completed:"complete", delayed_completion:"delayed", at_risk:"at_medium_risk", not_started:"not_yet_started" };
const SEV = { delayed:5, at_high_risk:4, at_medium_risk:3, at_low_risk:2, on_track:1, in_progress:1, not_yet_started:0, complete:0 };
const canon = s => { s = String(s||"").toLowerCase().trim(); s = ALIASES[s]||s; return (s in SEV) ? s : "not_yet_started"; };
const n0 = v => v==null ? 0 : Number(v)||0;
const pdate = s => {
  if(!s) return null;
  // "YYYY-MM-DD" is parsed as UTC by Date(), which lands on the previous day
  // for any timezone west of Greenwich. Build it as a local date instead.
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s));
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
};
const dayDiff = (a,b) => Math.round((a-b)/86400000);

/** Weight for the project rollup. Matches the dashboard exactly: the raw
 *  plannedDurationDays, falling back to 1 when MMT returns null. Do not
 *  substitute a duration derived from the planned dates — the dashboard
 *  does not, and the two artefacts must agree. */
function durationOf(o){
  return n0(o.plannedDurationDays) || 1;
}
function wavg(rows, field){
  let num=0, den=0;
  for(const r of rows){ const w = r.dur; num += n0(r[field])*w; den += w; }
  return den ? num/den : 0;
}
function worstStatus(rows){
  if(!rows.length) return "not_yet_started";
  const sts = rows.map(r => r.status);
  if(sts.every(s => s==="complete")) return "complete";   // all done
  if(sts.includes("delayed")) return "delayed";           // absolute priority
  return sts.reduce((a,b) => SEV[b] > SEV[a] ? b : a, sts[0]);
}
const maxDate = arr => { const v = arr.filter(Boolean); return v.length ? new Date(Math.max(...v)) : null; };

function buildModel(raw){
  const data = raw.data;
  const vendors=[], pos=[], items=[], miles=[], issues=[];
  for(const v of (data.projects||[])){
    const vname = String(v.name||"").replace(/&amp;/g,"&").trim();
    for(const po of (v.pos||[])){
      const dd = {}; for(const x of (po.dynamicData||[])) dd[x.key] = x.value;
      const q = po.quantity||{};
      const p = {
        vendorId:v.id, vendor:vname, poId:po.id,
        project:String(dd.projectName||"").trim() || "Unmapped",
        po:String(po.poNumber||""), desc:String(po.description||""),
        status:canon(po.status),
        pEnd:pdate(po.plannedEndDate), fEnd:pdate(po.estimatedEndDate)||pdate(po.plannedEndDate),
        slip:Math.max(0,n0(po.estimatedDelayDays)),
        act:n0(po.actualCompletionPercentage), exp:n0(po.expectedCompletionPercentage),
        dur:durationOf(po), durMissing:!(n0(po.plannedDurationDays)>0),
        qTot:n0(q.total), qExp:n0(q.expectedTillDate), qDel:n0(q.delivered),
        cu:n0(po.criticalUpdatesCount), cm:n0(po.commentsCount), img:n0(po.imagesCount)
      };
      pos.push(p);
      for(const x of (po.issues||[])) issues.push(mkIssue(x,"PO",p,null,null));
      for(const it of (po.items||[])){
        const st = it.milestoneStats||{}, iq = it.quantity||{};
        const ir = {
          poId:po.id, itemId:it.id, vendor:vname, project:p.project, po:p.po,
          code:String(it.itemCode||""), name:String(it.itemName||""),
          status:canon(it.status), slip:Math.max(0,n0(it.estimatedDelayDays)),
          act:n0(it.actualCompletionPercentage), exp:n0(it.expectedCompletionPercentage),
          msTot:n0(st.total), msDone:n0(st.completed), msDly:n0(st.delayed),
          qTot:n0(iq.total), qExp:n0(iq.expectedTillDate), qDel:n0(iq.delivered),
          cu:n0(it.criticalUpdatesCount)
        };
        items.push(ir);
        for(const x of (it.issues||[])) issues.push(mkIssue(x,"Item",p,ir,null));
        for(const m of (it.milestones||[])){
          const mr = {
            msId:m.id, vendor:vname, project:p.project, po:p.po, item:ir.name, code:ir.code,
            name:String(m.name||""), status:canon(m.status),
            pEnd:pdate(m.plannedEndDate), aEnd:pdate(m.actualEndDate),
            slip:Math.max(0,n0(m.estimatedDelayDays)), cu:n0(m.criticalUpdatesCount)
          };
          miles.push(mr);
          for(const x of (m.issues||[])) issues.push(mkIssue(x,"Milestone",p,ir,mr));
        }
      }
    }
    vendors.push({
      id:v.id, vendor:vname, status:canon(v.status),
      act:n0(v.actualCompletionPercentage), exp:n0(v.expectedCompletionPercentage),
      pEnd:pdate(v.plannedEndDate), fEnd:pdate(v.estimatedEndDate)||pdate(v.plannedEndDate),
      slip:Math.max(0,n0(v.estimatedDelayDays))
    });
  }

  // PROJECT — no entity in MMT; grouped on the PO dynamic-data key
  const names = [...new Set(pos.map(p=>p.project))].sort((a,b)=>
    a==="Unmapped" ? 1 : b==="Unmapped" ? -1 : a.localeCompare(b));
  const projects = names.map(nm => {
    const pp = pos.filter(p=>p.project===nm);
    return {
      project:nm, poCount:pp.length, status:worstStatus(pp),
      act:wavg(pp,"act"), exp:wavg(pp,"exp"),
      pEnd:maxDate(pp.map(p=>p.pEnd)), fEnd:maxDate(pp.map(p=>p.fEnd)),
      slip:Math.max(0,...pp.map(p=>p.slip)),
      vendors:[...new Set(pp.map(p=>p.vendor))],
      qTot:pp.reduce((s,p)=>s+p.qTot,0), qExp:pp.reduce((s,p)=>s+p.qExp,0), qDel:pp.reduce((s,p)=>s+p.qDel,0),
      noDur:pp.filter(p=>p.durMissing).length
    };
  });

  return {
    workspace:data.workspace||{}, asOf:raw.last_updated||null,
    vendors, projects, pos, items, miles, issues,
    totals:{
      qTot:pos.reduce((s,p)=>s+p.qTot,0), qExp:pos.reduce((s,p)=>s+p.qExp,0), qDel:pos.reduce((s,p)=>s+p.qDel,0),
      openIssues:issues.filter(i=>i.status!=="closed").length
    }
  };
}
function mkIssue(i, level, p, it, m){
  const rd = pdate(i.raisedDate);
  return {
    id:i.id, level, vendor:p.vendor, project:p.project, po:p.po,
    item:(it&&it.name)||"", code:(it&&it.code)||"", milestone:(m&&m.name)||"",
    text:String(i.text||""), status:String(i.status||"open").toLowerCase(),
    category:String(i.categoryName||""), contributor:String(i.contributor||""),
    raisedBy:person(i.raisedBy), assigned:person(i.assignedTo),
    raised:rd, closed:pdate(i.resolutionDate),
    notes:(i.notes||[]).map(n => typeof n==="string" ? n : String(n.text||n.note||n.comment||"")).filter(Boolean)
  };
}
const person = p => !p ? "" : `${p.firstName||""} ${p.lastName||""}`.trim();

/* ================================================================
   SUBJECTIVE MODEL — flatten the nested payload into tagged records
   ================================================================ */
function flattenSubjective(raw){
  const out = [];
  const push = (bucket, arr, level, ctx) => {
    for(const r of (arr||[])){
      out.push({
        kind:bucket, level,
        id:r.id, text:String(r.text||""),
        author:person(r.creator||r.raisedBy),
        authorType:(r.creator&&r.creator.userType)||(r.raisedBy&&r.raisedBy.userType)||"",
        date:pdate(r.dateAdded||r.raisedDate),
        raw:r, ...ctx
      });
    }
  };
  for(const v of (raw.data.projects||[])){
    const ctxV = { vendorId:v.id, vendor:String(v.name||"").trim(), poId:null, po:"", item:"", milestone:"" };
    push("comment", v.comments, "vendor", ctxV);
    push("critical_update", v.criticalUpdates, "vendor", ctxV);
    push("issue", v.issues, "vendor", ctxV);
    for(const po of (v.pos||[])){
      const ctxP = { ...ctxV, poId:po.id, po:String(po.poNumber||""), poVendorName:po.vendorName||"" };
      push("comment", po.comments, "po", ctxP);
      push("critical_update", po.criticalUpdates, "po", ctxP);
      push("issue", po.issues, "po", ctxP);
      for(const it of (po.items||[])){
        const ctxI = { ...ctxP, itemId:it.id, item:String(it.itemName||it.itemCode||"") };
        push("comment", it.comments, "item", ctxI);
        push("critical_update", it.criticalUpdates, "item", ctxI);
        push("issue", it.issues, "item", ctxI);
        for(const m of (it.milestones||[])){
          const ctxM = { ...ctxI, msId:m.id, milestone:String(m.name||"") };
          push("comment", m.comments, "milestone", ctxM);
          push("critical_update", m.criticalUpdates, "milestone", ctxM);
          push("issue", m.issues, "milestone", ctxM);
        }
      }
    }
  }
  return out;
}

async function getJSON(url){
  const res = await fetch(url, { headers:{ Accept:"application/json" }});
  if(!res.ok) throw new Error(`HTTP ${res.status} ${res.statusText}`);
  const j = await res.json();
  if(j && j.error) throw new Error(j.error);
  if(!j || !j.data) throw new Error("Response contained no data");
  return j;
}
function unresolved(u){ return !u || /^__.*__$/.test(u); }

async function loadDump(){
  S.loading = true; S.dumpErr = null; paint();
  const url = DEV.on ? DEV.dump : ENDPOINTS.dump;
  try{
    if(unresolved(url)) throw new Error("Dump endpoint placeholder not replaced (__MMT_DASHBOARD_DUMP_URL__)");
    S.dump = buildModel(await getJSON(url));
  }catch(e){ S.dumpErr = e.message || String(e); S.dump = null; }
  S.loading = false; paint();
}
async function loadSubjective(win){
  const base = DEV.on ? DEV.subjective : ENDPOINTS.subjective;
  if(unresolved(base)) throw new Error("Subjective endpoint placeholder not replaced (__MMT_SUBJECTIVE_URL__)");
  let url = base;
  if(!DEV.on){
    const u = new URL(base, location.href);
    u.searchParams.set("workspaceId", (S.dump.workspace.id)||"");
    u.searchParams.set(DATE_PARAMS.start, iso(win.start));
    u.searchParams.set(DATE_PARAMS.end,   iso(win.queryEnd));
    url = u.toString();
  }
  return await getJSON(url);
}

const slug = s => String(s).replace(/[^\w]+/g,"_").replace(/^_|_$/g,"");
function download(payload, filename, mime){
  const blob = payload instanceof Blob ? payload
             : new Blob([payload], { type: mime || "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

const XLSX_LIB = "https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js";
let _libP = null;
function loadExcelLib(){
  if(window.ExcelJS) return Promise.resolve(window.ExcelJS);
  if(_libP) return _libP;
  _libP = new Promise((res,rej)=>{
    const s = document.createElement("script");
    s.src = XLSX_LIB;
    s.onload = () => window.ExcelJS ? res(window.ExcelJS) : rej(new Error("ExcelJS loaded but unavailable"));
    s.onerror = () => rej(new Error("Could not load the Excel library from the CDN"));
    document.head.appendChild(s);
  });
  return _libP;
}

function mrow(ws, r, values, o){

async function buildWorkbook(m, activity, win){
  const ExcelJS = await loadExcelLib();
  const wb = new ExcelJS.Workbook();
  wb.creator = "Venwiz"; wb.created = new Date();
  const today = new Date();
  sheetExec(wb, m, today, win);
  sheetUpdates(wb, m, activity, win);
  sheetRisk(wb, m);
  sheetIssues(wb, m, activity, today);
  wb.eachSheet(ws => {
    ws.pageSetup = Object.assign({}, ws.pageSetup, {orientation:"landscape", fitToWidth:1, fitToPage:true});
    ws.views = ws.views && ws.views.length ? ws.views : [{showGridLines:false}];
    if(!ws.properties.tabColor) ws.properties.tabColor = {argb:A(NAVY)};
  });
  return wb;
}

function sheetExec(wb, m, today, win){
  const NC = 13;
  const ws = wb.addWorksheet("Executive Summary", {

  [26,18,14,13,13,13,12,12,12,12,12,12,11].forEach((w,i)=> ws.getColumn(i+1).width = w);

  const pos = m.pos, iss = m.issues;
  const t = m.totals;
  const openi = iss.filter(i=>i.status!=="closed");
  const closedi = iss.filter(i=>i.status==="closed");

  // --- header band
  const r0 = 2;
  [[1,2,"DELIVERY STATUS"],[3,9,"PO STATUS"],[10,13,"ACTIONABLES"]].forEach(([c1,c2,txt])=>{
    ws.mergeCells(r0,c1,r0,c2);

    cell.value = txt;
    cell.font = {name:XF, size:9, bold:true, color:{argb:"FFFFFFFF"}};

  });
  ws.getRow(r0).height = 20;

  const delivery = [
    ["Total quantity ordered", t.qTot, INT_FMT, NAVY],
    ["Expected by today", t.qExp, INT_FMT, NAVY],
    ["Delivered till date", t.qDel, INT_FMT, t.qDel>=t.qExp ? "16A34A" : "DC2626"],
    ["Qty Completion", t.qTot ? t.qDel/t.qTot : 0, PCT_FMT,
      (t.qTot && t.qDel/t.qTot>=0.8) ? "16A34A" : "DC2626"]
  ];
  delivery.forEach(([txt,v,fmtS,colour],k)=>{
    const rr = r0+1+k;
    const a1 = ws.getCell(rr,1);
    a1.value = txt;
    a1.font = {name:XF, size:9, bold:true, color:{argb:A("475569")}};
    a1.fill = fill(GREY);
    a1.alignment = {vertical:"middle", horizontal:"left", indent:1};
    a1.border = BORDER;
    const b1 = ws.getCell(rr,2);
    b1.value = v;
    b1.font = {name:XF, size:12, bold:true, color:{argb:A(colour)}};
    b1.numFmt = fmtS;
    b1.alignment = {vertical:"middle", horizontal:"center"};
    b1.border = BORDER;
    ws.getRow(rr).height = 22;
  });

  const labRow = r0+1, cnt1 = r0+2, cnt2 = r0+3, pctRow = r0+4;
  ORDER.forEach((st,k)=>{
    const c = 3+k, [fg,bg] = SCOL[st];
    const lc = ws.getCell(labRow,c);
    lc.value = SLAB[st];
    lc.font = {name:XF, size:8, bold:true, color:{argb:A(fg)}};
    lc.fill = fill(bg);
    lc.alignment = {vertical:"middle", horizontal:"center", wrapText:true};
    lc.border = BORDER;
    vmerge(ws, cnt1, cnt2, c, c, 0, INT_FMT, 14, fg);
    const pc = ws.getCell(pctRow,c);
    pc.value = 0; pc.numFmt = PCT_FMT;
    pc.font = {name:XF, size:9, color:{argb:A("475569")}};
    pc.alignment = {vertical:"middle", horizontal:"center"};
    pc.border = BORDER;
  });

  [["Total issues", iss.length, INT_FMT, NAVY],
   ["Open", openi.length, INT_FMT, openi.length?"DC2626":"16A34A"],
   ["Closed", closedi.length, INT_FMT, "16A34A"],
   ["% closed", null, PCT_FMT, NAVY]].forEach(([txt,v,fmtS,colour],k)=>{
    const cc = 10+k;
    const lc = ws.getCell(labRow,cc);
    lc.value = txt;
    lc.font = {name:XF, size:8, bold:true, color:{argb:A("475569")}};
    lc.fill = fill(GREY);
    lc.alignment = {vertical:"middle", horizontal:"center", wrapText:true};
    lc.border = BORDER;
    vmerge(ws, cnt1, pctRow, cc, cc, v, fmtS, 14, colour);
  });
  ws.getCell(cnt1,13).value = {formula:`IFERROR(L${cnt1}/J${cnt1},0)`};
  [labRow,cnt1,cnt2,pctRow].forEach(rr => ws.getRow(rr).height = 22);

  let r = pctRow+2;

  // --- vendor details
  bar(ws, r, "VENDOR DETAILS   \u00B7   click + in the left margin to open a vendor's POs", NC);
  r++;
  mhdr(ws, r, ["Vendor  /  PO","PO number","Project","Status","Actual %","Expected %","Planned ETD","Forecast ETD","Slip (days)"]);
  r++;
  const venFirst = r;
  const fmts = {5:PCT_FMT, 6:PCT_FMT, 7:DATE_FMT, 8:DATE_FMT, 9:INT_FMT};

  const writeChildren = (list, thirdCol) => {
    list.slice().sort(bySev).forEach(p=>{
      if(p.status==="complete"){ completedBand(ws, r, NC, `PO ${p.po}  \u2014  ${p.desc}`, 1, true); r++; return; }
      mrow(ws, r, ["      "+p.desc, p.po, thirdCol(p), null, p.act/100, p.exp/100, xd(p.pEnd), xd(p.fEnd), p.slip],
           {fmts, size:8, height:20, centre:[2]});
      stCell(ws, r, 6, p.status, 8);
      if(p.slip) ws.getCell(r,13).font = {name:XF, size:8, bold:true, color:{argb:A("DC2626")}};
      const row = ws.getRow(r); row.outlineLevel = 1; row.hidden = true;
      r++;
    });
  };

  m.vendors.slice().sort(bySev).forEach(v=>{
    const vpos = m.pos.filter(p=>p.vendorId===v.id);
    if(vpos.length && vpos.every(p=>p.status==="complete")){
      completedBand(ws, r, NC, `${v.vendor}   \u00B7   ${vpos.length} PO${vpos.length>1?"s":""}`);
      r++; return;
    }
    mrow(ws, r, [v.vendor, `${vpos.length} PO${vpos.length>1?"s":""}`, "", null,
                 v.act/100, v.exp/100, xd(v.pEnd), xd(v.fEnd), v.slip],
         {fmts, fill:VENDF, bold:[1], height:24, centre:[2]});
    stCell(ws, r, 6, v.status);
    if(v.slip) ws.getCell(r,13).font = {name:XF, size:9, bold:true, color:{argb:A("DC2626")}};
    r++;
    writeChildren(vpos, p=>p.project);
  });
  const venLast = r-1;
  r++;

  // --- project details
  bar(ws, r, "PROJECT DETAILS   \u00B7   click + to open a project's POs", NC);
  r++;
  mhdr(ws, r, ["Project  /  PO","PO number","Vendor","Status","Actual %","Expected %","Planned ETD","Forecast ETD","Slip (days)"]);
  r++;
  m.projects.slice().sort((a,b)=> (a.project==="Unmapped")-(b.project==="Unmapped") || bySev(a,b)).forEach(pr=>{
    const ppos = m.pos.filter(p=>p.project===pr.project);
    if(ppos.length && ppos.every(p=>p.status==="complete")){
      completedBand(ws, r, NC, `${pr.project}   \u00B7   ${pr.poCount} PO${pr.poCount>1?"s":""}`);
      r++; return;
    }
    mrow(ws, r, [pr.project, `${pr.poCount} PO${pr.poCount>1?"s":""}`,
                 pr.vendors.length===1 ? pr.vendors[0] : `${pr.vendors.length} vendors`, null,
                 pr.act/100, pr.exp/100, xd(pr.pEnd), xd(pr.fEnd), pr.slip],
         {fmts, fill:VENDF, bold:[1], height:24, centre:[2]});
    stCell(ws, r, 6, pr.status);
    if(pr.slip) ws.getCell(r,13).font = {name:XF, size:9, bold:true, color:{argb:A("DC2626")}};
    r++;
    writeChildren(ppos, p=>p.vendor);
  });
  r++;

  // --- header formulas over the vendor block
  const rngS = `$F$${venFirst}:$F$${venLast}`, rngP = `$D$${venFirst}:$D$${venLast}`;
  const compCol = 3 + ORDER.indexOf("complete");
  ORDER.forEach((st,k)=>{
    const c = 3+k, L = col(c);
    if(c===compCol){
      // Completed POs render as tick bands with no status cell for COUNTIFS to find,
      // so the widget carries the real count directly.
      ws.getCell(cnt1,c).value = m.pos.filter(p=>p.status==="complete").length;
    }else{
      ws.getCell(cnt1,c).value = {formula:`COUNTIFS(${rngS},${L}$${labRow},${rngP},"<>")`};
    }
    ws.getCell(pctRow,c).value = {formula:`IFERROR(${L}${cnt1}/${m.pos.length},0)`};
  });
  const issLast = Math.max(3 + openi.length, 4);
  ws.getCell(cnt1,11).value = {formula:`COUNTA('Issues & Actionables'!$A$4:$A$${issLast})`};

  footnote(ws, r, NC,
    "Vendor rows come straight from MMT. Project is a dynamic-data key on the PO, so project rows are computed: "+
    "actual and expected are duration-weighted averages of the project's POs, ETDs are the latest across those POs, "+
    "and status is the worst PO status with Delayed taking priority. Weighting uses plannedDurationDays, "+
    "which MMT returns as null on some POs \u2014 those carry a weight of 1.", 1);
  return ws;
}

function sheetUpdates(wb, m, activity, win){
  const NC = 7;
  const ws = wb.addWorksheet("Weekly Critical Updates", {views:[{state:"frozen", xSplit:0, ySplit:2, showGridLines:false}]});
  masthead(ws, `CRITICAL UPDATES   \u2014   ${fmtShort(win.start)} to ${fmt(win.queryEnd)}`, NC);

  ["Vendor","PO","Project","Raised at","Critical update","Logged by","Logged on"].forEach((h,i)=>{
    const c = ws.getCell(2,i+1);
    c.value = h;
    c.font = {name:XF, size:9, bold:true, color:{argb:"FFFFFFFF"}};
    c.fill = fill(NAVY);
    c.alignment = {vertical:"middle", horizontal:"center", wrapText:true};
    c.border = {left:thin, right:thin, top:thin, bottom:{style:"medium", color:{argb:A(VBLUE)}}};
  });
  [26,13,26,34,74,15,13].forEach((w,i)=> ws.getColumn(i+1).width = w);
  ws.getRow(2).height = 30;

  const cu = activity.filter(a => a.kind==="critical_update" && (!a.date || (a.date>=win.start && a.date<=win.queryEnd)));
  let r = 3;
  if(!cu.length){
    const c = ws.getCell(r,1);
    c.value = "No critical updates were logged in this window.";
    c.font = {name:XF, size:9, italic:true, color:{argb:A("64748B")}};
    return ws;
  }

  const projOf = {}; m.pos.forEach(p => projOf[p.po] = p.project);
  const raisedAt = a =>
    a.level==="milestone" ? `${a.item} > ${a.milestone}` :
    a.level==="item"      ? `Item: ${a.item}` :
    a.level==="po"        ? "PO level" :
    a.level==="vendor"    ? "Vendor level" : "Project level";

  const groups = new Map();
  cu.forEach(a=>{
    const k = `${a.vendor}\u0000${a.po||""}`;
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(a);
  });
  const keys = [...groups.keys()].sort();

  keys.forEach((k,gi)=>{
    const rows = groups.get(k);
    const [vn,po] = k.split("\u0000");
    if(gi){ ws.getRow(r).height = 14; r++; }
    const head = [vn, po||"\u2014", po?(projOf[po]||"\u2014"):"\u2014",
                  `${rows.length} critical update${rows.length>1?"s":""}`, "", "", ""];
    head.forEach((v,i)=>{
      const j = i+1, c = ws.getCell(r,j);
      c.value = v;
      c.font = {name:XF, size:9, bold:[1,2,4].includes(j), color:{argb:A(j<=4?"6B4A00":"8A7350")}};
      c.fill = fill(CREAM);
      c.alignment = {vertical:"middle", horizontal:[2,4].includes(j)?"center":"left",
                     wrapText:[1,3].includes(j), indent:[2,4].includes(j)?0:1};
      c.border = {left:thin, right:thin, bottom:thin, top:{style:"medium", color:{argb:A(VBLUE)}}};
    });
    ws.getRow(r).height = 26;
    r++;
    rows.sort((a,b)=>(b.date||0)-(a.date||0)).forEach(a=>{
      ["", "", "", raisedAt(a), a.text, a.author||"\u2014", xd(a.date)].forEach((v,i)=>{
        const j = i+1, c = ws.getCell(r,j);
        if(v !== null && v !== undefined) c.value = v;
        c.border = BORDER;
        if(j===4){
          c.font = {name:XF, size:8, bold:true, color:{argb:A("334155")}};
          c.fill = fill("FDFBF3");
          c.alignment = {vertical:"middle", wrapText:true, indent:1};
        }else if(j===5){
          c.font = {name:XF, size:9};
          c.alignment = {vertical:"middle", wrapText:true, indent:1};
        }else{
          c.font = {name:XF, size:9};
          c.alignment = {vertical:"middle", horizontal:"center"};
          if(j===7) c.numFmt = DATE_FMT;
        }
      });
      ws.getRow(r).height = 52;
      r++;
    });
  });

  r++;
  footnote(ws, r, NC,
    "Critical updates logged inside the report window, straight from MMT. 'Raised at' names the level the update was "+
    "logged against. Vendor and project-level updates carry no PO or item, because they sit above the level where "+
    "those resolve.", 2);
  return ws;
}

function sheetRisk(wb, m){
  const NC = 4;
  const ws = wb.addWorksheet("Risk & Recovery", {views:[{state:"frozen", xSplit:0, ySplit:2, showGridLines:false}]});
  masthead(ws, "RISK & RECOVERY   \u2014   COMPLETED MANUALLY", NC);
  hdrRow(ws, 2, ["Vendor","PO  /  Scope","Risk","Recovery plan"], [28,30,56,66]);
  ws.getRow(2).height = 30;
  for(let j=1;j<=NC;j++)
    ws.getCell(2,j).border = {left:thin, right:thin, top:thin, bottom:{style:"medium", color:{argb:A(VBLUE)}}};

  const edge = {style:"thin", color:{argb:A("E4D9B8")}};
  const ENTRY_B = {left:edge, right:edge, top:edge, bottom:edge};
  const med = {style:"medium", color:{argb:A("94A3B8")}};

  const groups = new Map();
  m.pos.filter(p=>p.status!=="complete").forEach(p=>{
    if(!groups.has(p.vendor)) groups.set(p.vendor, []);
    groups.get(p.vendor).push(p);
  });
  const order = [...groups.entries()].sort((a,b)=>
    (Math.max(...b[1].map(p=>SEV[p.status])) - Math.max(...a[1].map(p=>SEV[p.status]))) ||
    (Math.max(...b[1].map(p=>p.slip)) - Math.max(...a[1].map(p=>p.slip))));

  let r = 3;
  order.forEach(([vendor, plist])=>{
    plist.sort(bySev);
    const first = r;
    plist.forEach(p=>{
      const pc = ws.getCell(r,2);
      pc.value = `${p.po}\n${p.desc}`;
      pc.font = {name:XF, size:9, bold:true, color:{argb:A("1E2A3A")}};
      pc.alignment = {vertical:"middle", horizontal:"left", wrapText:true, indent:1};
      pc.border = BORDER;
      [1,3,4].forEach(j=>{
        const c = ws.getCell(r,j);
        c.value = "";
        c.font = {name:XF, size:9};
        c.alignment = {vertical:"middle", wrapText:[3,4].includes(j), indent:1};
        if([3,4].includes(j)){ c.fill = fill(ENTRY); c.border = ENTRY_B; }
        else c.border = BORDER;
      });
      ws.getRow(r).height = 40;
      r++;
    });
    const last = r-1;
    if(last>first) ws.mergeCells(first,1,last,1);
    const vc = ws.getCell(first,1);
    vc.value = vendor;
    vc.font = {name:XF, size:10, bold:true, color:{argb:A("1E2A3A")}};
    vc.alignment = {vertical:"middle", horizontal:"left", wrapText:true, indent:1};
    for(let rr=first;rr<=last;rr++) ws.getCell(rr,1).fill = fill(VENDF);
    for(let cc=1;cc<=NC;cc++){
      const c = ws.getCell(first,cc);
      c.border = Object.assign({}, c.border, {top:med});
    }
  });
  for(let cc=1;cc<=NC;cc++){
    const c = ws.getCell(r-1,cc);
    c.border = Object.assign({}, c.border, {bottom:med});
  }

  r++;
  ws.mergeCells(r,1,r,NC);
  const fn = ws.getCell(r,1);
  fn.value = "Every PO that is not yet complete, grouped under its vendor. Cream cells are for typing into. "+
             "A vendor drops off this sheet once all its POs close.";
  fn.font = {name:XF, size:8, italic:true, color:{argb:A("64748B")}};
  fn.alignment = {vertical:"middle", wrapText:true, indent:1};
  ws.getRow(r).height = 24;
  ws.pageSetup = {printTitlesRow:"1:2"};
  return ws;
}

function sheetIssues(wb, m, activity, today){
  const NC = 12;
  const ws = wb.addWorksheet("Issues & Actionables", {views:[{state:"frozen", xSplit:0, ySplit:3, showGridLines:false}]});
  masthead(ws, "ISSUES & ACTIONABLES   \u2014   OPEN ISSUES", NC);

  // notes for an issue may arrive on the subjective feed rather than the dump
  const extraNotes = {};
  activity.filter(a=>a.kind==="issue").forEach(a=>{
    const ns = (a.raw.notes||[]).map(n => typeof n==="string" ? n : String(n.text||"")).filter(Boolean);
    if(ns.length) extraNotes[a.id] = ns;
  });

  const openi = m.issues.filter(i=>i.status!=="closed").map(i=>{
    const age = i.raised ? Math.max(0, dayDiff(today, i.raised)) : null;
    const notes = (extraNotes[i.id] && extraNotes[i.id].length) ? extraNotes[i.id] : i.notes;
    return Object.assign({}, i, {age, notes});
  }).sort((a,b)=>(b.age||0)-(a.age||0));

  bar(ws, 2, `${openi.length} open issue${openi.length!==1?"s":""}`, NC, "FEF3C7", "92400E");
  hdrRow(ws, 3, ["Vendor","PO  /  Project","Item","Milestone","Category","Contributor","Issue",
                 "Raised by","Assigned to","Raised on","Age (days)","Notes"],
         [24,26,24,26,19,13,50,14,15,12,10,34]);

  let r = 4;
  if(!openi.length){
    const c = ws.getCell(r,1);
    c.value = "No open issues recorded in MMT.";
    c.font = {name:XF, size:9, italic:true, color:{argb:A("64748B")}};
    return ws;
  }
  openi.forEach((i,k)=>{
    const vals = [i.vendor, i.po + (i.project ? "\n"+i.project : ""),
                  i.item||"-", i.milestone||"-", i.category||"-", i.contributor||"-", i.text,
                  i.raisedBy||"-", i.assigned||"-", xd(i.raised), i.age,
                  i.notes.length ? i.notes.join("  |  ") : "-"];
    vals.forEach((v,idx)=>{
      const j = idx+1, c = ws.getCell(r,j);
      if(v !== null && v !== undefined) c.value = v;
      c.font = {name:XF, size:9, bold:(j===1)};
      c.border = BORDER;
      const centre = [5,6,10,11].includes(j);
      c.alignment = {vertical:"middle", horizontal:centre?"center":"left",
                     wrapText:[2,3,4,7,12].includes(j), indent:centre?0:1};
      if(j===10) c.numFmt = DATE_FMT;
      if(j===11) c.numFmt = INT_FMT;
      if(k%2===1) c.fill = fill(BANDF);
    });
    if((i.age||0) > 14)
      ws.getCell(r,11).font = {name:XF, size:9, bold:true, color:{argb:A("DC2626")}};
    r++;   // no explicit height, so Excel auto-fits the row to its wrapped content
  });
  return ws;
}

   DAILY REPORT — Vendor Visit Report (Word .docx)
   Per vendor, over a chosen reporting period.
   ================================================================ */
const DOCX_LIB = "https://cdn.jsdelivr.net/npm/docx@9.7.1/dist/index.iife.js";
let _docxP = null;
function loadDocxLib(){
  if(window.docx) return Promise.resolve(window.docx);
  if(_docxP) return _docxP;
  _docxP = new Promise((res,rej)=>{
    const s = document.createElement("script");
    s.src = DOCX_LIB;
    s.onload = () => window.docx ? res(window.docx) : rej(new Error("Word library loaded but unavailable"));
    s.onerror = () => rej(new Error("Could not load the Word library from the CDN"));
    document.head.appendChild(s);
  });
  return _docxP;
}

const MAX_WINDOW_DAYS = 180;

/* Place of Expediting list.
   One entry per top-level projects[] record. In MMT the project hierarchy IS the
   vendor, so this listing is the vendor listing — each record keyed by its own
   stable id, never merged. Deliberately NOT built from po.vendorName, which is
   free text and splits one vendor across several spellings. Labels are
   disambiguated if two records ever carry the same name. */
function expeditingPlaces(m){
  const list = m.vendors.map(v => ({
    id: v.id,
    vendor: v.vendor,
    pos: m.pos.filter(p => p.vendorId === v.id).sort((a,b)=>a.po.localeCompare(b.po))
  })).sort((a,b) => a.vendor.localeCompare(b.vendor));
  const seen = {};
  list.forEach(e => { seen[e.vendor] = (seen[e.vendor]||0) + 1; });
  list.forEach(e => {
    e.label = e.vendor + (seen[e.vendor] > 1 && e.pos.length ? ` (PO ${e.pos[0].po}\u2026)` : "");
  });
  return list;
}

function renderDaily(){
  const m = S.dump, st = $("#stage");
  const d = S.daily;
  const vendors = expeditingPlaces(m);
  if((!d.vendorId || !vendors.some(x=>x.id===d.vendorId)) && vendors.length) d.vendorId = vendors[0].id;
  if(!d.from){ const t=new Date(); d.from = iso(new Date(t.getFullYear(),t.getMonth(),t.getDate()-1)); }
  if(!d.to) d.to = iso(new Date());

  const v = vendors.find(x=>x.id===d.vendorId);
  const vpos = v ? v.pos : [];
  const err = rangeError(d.from, d.to);
  const days = err ? 0 : dayDiff(pdate(d.to), pdate(d.from)) + 1;

  st.innerHTML = `
  <section class="panel">
    <div class="panel-head">
      <div class="eyebrow">Daily</div>
      <h2>Vendor visit report</h2>
      <p>The visit record for one vendor over a chosen reporting period — PO details, a visit summary of
         everything raised at PO level, and a status card per PO showing updates and how far each item moved.</p>
    </div>

    <div class="panel-body">
      <div class="field">
        <label class="flabel" for="dvendor">Place of expediting</label>
        <select class="fsel" id="dvendor">
          ${vendors.map(x=>`<option value="${esc(x.id)}" ${x.id===d.vendorId?"selected":""}>${esc(x.label)} \u00B7 ${x.pos.length} PO${x.pos.length===1?"":"s"}</option>`).join("")}
        </select>
      </div>

      <div class="field">
        <label class="flabel">Reporting period</label>
        <div class="range">
          <input type="date" class="fdate" id="dfrom" value="${d.from}" max="${iso(new Date())}">
          <span class="dash">to</span>
          <input type="date" class="fdate" id="dto" value="${d.to}" max="${iso(new Date())}">
        </div>
        ${err ? `<div class="ferr">${esc(err)}</div>`
              : `<div class="fhint">${days} day${days===1?"":"s"} — ${fmt(pdate(d.from))} to ${fmt(pdate(d.to))}</div>`}
      </div>

      <div class="facts">
        <div class="fact"><div class="k">Purchase orders</div><div class="v">${vpos.length}</div></div>
        <div class="fact"><div class="k">PO quantity</div><div class="v">${num(vpos.reduce((s,p)=>s+p.qTot,0))}</div></div>
        <div class="fact"><div class="k">Delivered</div><div class="v">${num(vpos.reduce((s,p)=>s+p.qDel,0))}</div></div>
        <div class="fact"><div class="k">Open issues</div><div class="v">${v?m.issues.filter(i=>i.status!=="closed"&&vpos.some(p=>p.po===i.po)).length:0}</div></div>
      </div>

      <div class="note">
        <strong>Visit number and participants are left blank.</strong> Both are filled in by hand after
        download, exactly as in the current template. Everything else is generated from MMT.
      </div>

      <div class="actions">
        <button class="btn" id="genDaily" ${err?"disabled":""}>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v13M7 12l5 5 5-5M4 21h16"/></svg>
          Download visit report (.docx)
        </button>
        <span class="hint">Pulls updates and item movement for the period.</span>
      </div>
      <div id="genErr"></div>
    </div>
  </section>`;

  $("#dvendor").addEventListener("change", e => { S.daily.vendorId = e.target.value; renderDaily(); });
  $("#dfrom").addEventListener("change", e => { S.daily.from = e.target.value; renderDaily(); });
  $("#dto").addEventListener("change", e => { S.daily.to = e.target.value; renderDaily(); });
  const g = $("#genDaily");
  if(g) g.addEventListener("click", generateDaily);
  if(S.genErr) showGenErr(S.genErr);
}

function rangeError(from, to){
  const a = pdate(from), b = pdate(to);
  if(!a || !b) return "Both dates are required.";
  if(a > b) return "The start date must be on or before the end date.";
  const t = new Date(); const today = new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(b > today) return "The end date cannot be in the future.";
  if(dayDiff(b,a) + 1 > MAX_WINDOW_DAYS) return `The period cannot exceed ${MAX_WINDOW_DAYS} days.`;
  return null;
}

/* ---- generate */
async function generateDaily(){
  const d = S.daily, m = S.dump;
  const btn = $("#genDaily");
  const win = { start:pdate(d.from), queryEnd:pdate(d.to), end:pdate(d.to), partial:false };
  const vendor = expeditingPlaces(m).find(x=>x.id===d.vendorId);
  btn.disabled = true;
  btn.innerHTML = `<span class="sp"></span> Fetching updates…`;
  $("#genErr").innerHTML = ""; S.genErr = null;
  try{
    const [subjRaw, verRaw] = await Promise.all([ loadSubjective(win), loadVersions(win) ]);
    const activity = flattenSubjective(subjRaw);
    const moves = flattenVersions(verRaw);
    btn.innerHTML = `<span class="sp"></span> Building document…`;
    const blob = await buildVisitReport(m, vendor, activity, moves, win);
    const name = `Vendor_Visit_Report_${slug(vendor.vendor)}_${d.from}_to_${d.to}.docx`;
    download(blob, name, "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 6L9 17l-5-5"/></svg> Downloaded`;
    setTimeout(()=>{ btn.disabled=false; renderDaily(); }, 2200);
  }catch(e){
    S.genErr = e.message || String(e);
    btn.disabled = false;
    btn.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3v13M7 12l5 5 5-5M4 21h16"/></svg> Download visit report (.docx)`;
    showGenErr(S.genErr);
  }
}

async function loadVersions(win){
  const base = ENDPOINTS.reserved;
  if(unresolved(base)) throw new Error("Version endpoint placeholder not replaced (__MMT_RESERVED_URL__)");
  const u = new URL(base, location.href);
  u.searchParams.set("workspaceId", S.dump.workspace.id||"");
  u.searchParams.set(DATE_PARAMS.start, iso(win.start));
  u.searchParams.set(DATE_PARAMS.end,   iso(win.queryEnd));
  return await getJSON(u.toString());
}

/* Flatten the version payload into per-item movement, keyed by PO number. */
function flattenVersions(raw){
  const out = {};   // poNumber -> [{item, from, to}]
  const stat = (arr,key) => (arr||[]).find(s => s.key===key) || null;
  for(const v of ((raw.data&&raw.data.projects)||[])){
    for(const po of (v.pos||[])){
      const key = String(po.poNumber||"");
      const rows = [];
      for(const it of (po.items||[])){
        const s = stat(it.stats, "completionPercentage");
        if(!s) continue;
        const from = s.earliest ? s.earliest.value : null;
        const to   = s.latest   ? s.latest.value   : null;
        if(to == null || from === to) continue;        // only real movement
        rows.push({ item:String(it.itemName||it.itemCode||""), from, to });
      }
      if(rows.length) out[key] = rows;
    }
  }
  return out;
}

function b64bytes(b64){
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function buildVisitReport(m, vendor, activity, moves, win){
  const D = await loadDocxLib();
  const { Document, Packer, Paragraph, TextRun, Table, TableRow, TableCell, WidthType,
          AlignmentType, BorderStyle, ShadingType, Header, Footer, PageNumber, ImageRun,
          VerticalAlign, LevelFormat, convertInchesToTwip } = D;

  const F = VVR;
  const T = (text,o) => new TextRun(Object.assign(
        {text:String(text==null?"":text), font:F.FONT, size:19}, o||{}));
  const line = (color,size,space) => ({style:BorderStyle.SINGLE, color, size, space:space||0});
  const gl = line(F.BORDER,4);
  const CELLB = {top:gl,bottom:gl,left:gl,right:gl};
  const M_CELL = {top:60,bottom:60,left:90,right:90};
  const M_BODY = {top:110,bottom:130,left:170,right:170};

  const cell = (children,o) => new TableCell(Object.assign({
      children:Array.isArray(children)?children:[children],
      borders:CELLB, margins:M_CELL, verticalAlign:VerticalAlign.TOP}, o||{}));
  const th = (s,w) => cell(new Paragraph({children:[T(s,{bold:true,color:"FFFFFF"})],
        alignment:AlignmentType.CENTER, spacing:{before:0,after:0,line:264}}),
      {shading:{type:ShadingType.CLEAR,fill:F.HEADFILL}, width:{size:w,type:WidthType.DXA}});
  const td = (s,w,o) => { o=o||{};
    return cell(new Paragraph({children:[T(s,o.run||{})],
        alignment:o.align||AlignmentType.LEFT, spacing:{before:0,after:0,line:264}}),
      Object.assign({width:{size:w,type:WidthType.DXA}}, o.cell||{})); };
  const table = (rows,widths) => new Table({rows, columnWidths:widths,
      width:{size:widths.reduce((a,b)=>a+b,0), type:WidthType.DXA},
      borders:{top:gl,bottom:gl,left:gl,right:gl,insideHorizontal:gl,insideVertical:gl}});
  const headRow = cells => new TableRow({children:cells, tableHeader:true, cantSplit:true});
  // A PO card is one block, not a long table: if it spills onto the next page the
  // continuation should just carry on, not restate PO No. / Project Name / etc.
  const cardHead = cells => new TableRow({children:cells, tableHeader:false, cantSplit:true});

  const heading = n => new Paragraph({ children:[T(n,{bold:true,size:24,color:F.NAVY})],
      border:{bottom:line(F.NAVY,8,3)}, spacing:{before:300,after:120}, keepNext:true });
  const caption = s => new Paragraph({ children:[T(s,{italics:true,size:17,color:F.CAP})],
      spacing:{before:40,after:120} });
  const sublabel = (s,colour) => new Paragraph({
      children:[T(s,{bold:true,size:18,color:colour||F.LABEL})],
      spacing:{before:130,after:60}, keepNext:true });

  const vpos = (vendor.pos || m.pos.filter(p=>p.vendorId===vendor.id)).slice().sort((a,b)=>a.po.localeCompare(b.po));
  const poNums = new Set(vpos.map(p=>p.po));
  const acts = activity.filter(a => a.date && a.date>=win.start && a.date<=win.queryEnd && poNums.has(a.po));
  const poTitle = p => `PO No. ${p.po}  \u2014  ${p.project}`;
  const CTR = AlignmentType.CENTER;

  const kids = [];

  /* title */
  kids.push(new Paragraph({ children:[T("VENDOR VISIT REPORT",{bold:true,size:30,color:F.NAVY})],
    alignment:CTR, spacing:{before:60,after:200} }));

  /* header block */
  const HG = F.GRID.head;
  const hrow = (a,b,c,d2) => new TableRow({children:[
    td(a,HG[0],{run:{bold:true}}), td(b,HG[1]), td(c,HG[2],{run:{bold:true}}), td(d2,HG[3])]});
  kids.push(table([
    hrow("Client:", m.workspace.name||"", "Place of Expediting:", vendor.vendor),
    hrow("Scope:", "Vendor Visit", "Report Date:", ddmmyyyy(new Date())),
    hrow("Reporting Period:", `${ddmmyyyy(win.start)} to ${ddmmyyyy(win.queryEnd)}`, "Visit No.:", "")
  ], HG));
  kids.push(caption("All fields above are generated from MMT except Visit No., which is entered manually."));

  /* participants — left blank */
  const PG = F.GRID.part;
  const client = (m.workspace.name||"Client").split(/[\u2013\u2014-]/)[0].trim();
  const prow = label => new TableRow({children:[
    td(label,PG[0],{run:{bold:true}}), td("",PG[1])]});
  kids.push(table([
    prow(`Participants from ${client}`),
    prow(`Participants from ${vendor.vendor}`),
    prow("Participants from Venwiz Technologies Pvt. Ltd.")
  ], PG));
  kids.push(caption("Participant rows are left blank by the generator and filled in manually after download."));

  /* 1. PO Details */
  kids.push(heading("1.  PO Details"));
  const DG = F.GRID.det;
  const drows = [ headRow([th("Sr. No.",DG[0]),th("PO No.",DG[1]),th("Project Name",DG[2]),
                           th("Total PO Qty",DG[3]),th("Delivered Qty",DG[4])]) ];
  vpos.forEach((p,i)=> drows.push(new TableRow({children:[
    td(String(i+1),DG[0],{align:CTR}), td(p.po,DG[1],{align:CTR}), td(p.project,DG[2]),
    td(String(p.qTot),DG[3],{align:CTR}), td(String(p.qDel),DG[4],{align:CTR})]})));
  drows.push(new TableRow({children:[
    td("",DG[0]), td("",DG[1]),
    td("Total",DG[2],{run:{bold:true}, align:AlignmentType.RIGHT}),
    td(String(vpos.reduce((s,p)=>s+p.qTot,0)),DG[3],{run:{bold:true},align:CTR}),
    td(String(vpos.reduce((s,p)=>s+p.qDel,0)),DG[4],{run:{bold:true},align:CTR})]}));
  kids.push(table(drows,DG));
  kids.push(caption("Delivered Qty is derived from milestone completion in MMT and is not entered manually."));

  /* 2. Visit Summary — PO-level issues and critical updates only */
  kids.push(heading("2.  Visit Summary"));
  kids.push(caption(`Includes only those POs against which an Issue or a Critical Update was raised at PO level `+
    `between ${ddmmyyyy(win.start)} and ${ddmmyyyy(win.queryEnd)}. Each entry appears exactly as formatted in MMT.`));
  const poLevel = acts.filter(a=>a.level==="po" && (a.kind==="issue"||a.kind==="critical_update"));
  if(!poLevel.length){
    kids.push(new Paragraph({children:[T("No issues or critical updates were raised at PO level during the reporting period.",
      {italics:true,color:F.CAP,size:18})], spacing:{after:80}}));
  }else{
    vpos.forEach(p=>{
      const iss = poLevel.filter(a=>a.po===p.po&&a.kind==="issue");
      const cus = poLevel.filter(a=>a.po===p.po&&a.kind==="critical_update");
      if(!iss.length && !cus.length) return;
      kids.push(new Paragraph({children:[T(poTitle(p),{bold:true,size:20,color:F.NAVY})],
        spacing:{before:180,after:80}, keepNext:true}));
      if(iss.length){
        kids.push(sublabel("Issues",F.RAISED));
        iss.forEach(a=>kids.push(new Paragraph({children:[T(a.text)],bullet:{level:0},spacing:{after:40}})));
      }
      if(cus.length){
        kids.push(sublabel("Critical Updates",F.RAISED));
        cus.forEach(a=>kids.push(new Paragraph({children:[T(a.text)],bullet:{level:0},spacing:{after:40}})));
      }
    });
  }

  /* 3. Current Status — one bordered block per PO that saw activity */
  const hasContent = p => acts.some(a=>a.po===p.po) || (moves[p.po]||[]).length > 0;
  const active = vpos.filter(hasContent);
  const quiet  = vpos.filter(p=>!hasContent(p));
  let sectionNo = 3;

  kids.push(heading("3.  Current Status"));
  kids.push(caption("One bordered block per PO with activity in the reporting period. Within each block, a section appears only if there is content for it."));
  const CG = F.GRID.card;
  if(!active.length){
    kids.push(new Paragraph({children:[T("No PO recorded any update or item movement during the reporting period.",
      {italics:true,color:F.CAP,size:18})], spacing:{after:120}}));
  }
  active.forEach(p=>{
    const rows = [
      cardHead([th("PO No.",CG[0]),th("Project Name",CG[1]),th("PO Qty",CG[2]),th("Delivered",CG[3]),
               th("Actual Completion",CG[4]),th("Expected Completion",CG[5]),th("Current Status",CG[6])]),
      new TableRow({children:[
        td(p.po,CG[0],{run:{bold:true},align:CTR}), td(p.project,CG[1]),
        td(String(p.qTot),CG[2],{align:CTR}), td(String(p.qDel),CG[3],{align:CTR}),
        td(`${Math.round(p.act)}%`,CG[4],{align:CTR}), td(`${Math.round(p.exp)}%`,CG[5],{align:CTR}),
        td(SLAB[p.status]||"",CG[6],{align:CTR,
           run:{bold:true,color:VVR_STATUS[p.status]||VVR_STATUS.not_yet_started}})]})
    ];

    const body = [];
    const upd = acts.filter(a=>a.po===p.po && a.level==="po" && a.kind==="comment");
    if(upd.length){
      body.push(sublabel("PO Updates"));
      upd.forEach((a,i)=> body.push(new Paragraph({
        children:[T(`${i+1}.`,{bold:false}), T("\u00A0\u00A0"), T(a.text)],
        indent:{left:420,hanging:250}, spacing:{after:40}})));
    }
    const il = acts.filter(a=>a.po===p.po && (a.level==="item"||a.level==="milestone"));
    if(il.length){
      body.push(sublabel("Item Level Updates"));
      il.forEach(a=>{
        const runs = [T(a.item,{bold:true})];
        if(a.milestone) runs.push(T("  \u203A  ",{bold:true,color:"9AA6BC"}), T(a.milestone,{bold:true}));
        runs.push(T(":  "), T(a.text));
        body.push(new Paragraph({children:runs, bullet:{level:0}, spacing:{after:40}}));
      });
    }
    const mv = moves[p.po] || [];
    if(mv.length){
      body.push(sublabel("Item Movement"));
      const MG = F.GRID.move;
      const sh = (t,w) => cell(new Paragraph({children:[T(t,{bold:true,size:18,color:F.LABEL})],
            alignment:CTR, spacing:{before:0,after:0,line:264}}),
          {shading:{type:ShadingType.CLEAR,fill:F.SOFT}, width:{size:w,type:WidthType.DXA}});
      const mrows = [ cardHead([sh("Item",MG[0]),sh("From",MG[1]),sh("To",MG[2])]) ];
      mv.forEach(x=> mrows.push(new TableRow({children:[
        td(x.item,MG[0]),
        td(x.from==null?"\u2014":`${Math.round(x.from)}%`,MG[1],{align:CTR}),
        td(x.to==null?"\u2014":`${Math.round(x.to)}%`,MG[2],{align:CTR,run:{bold:true}})]})));
      body.push(table(mrows,MG));
    }
    rows.push(new TableRow({children:[ cell(body,
      {columnSpan:7, width:{size:F.W,type:WidthType.DXA}, margins:M_BODY}) ]}));
    kids.push(table(rows,CG));
    kids.push(new Paragraph({spacing:{after:200}}));
  });

  /* 4. Photographs — only when the feed carries attachments */
  const withPics = acts.filter(a => (a.raw.attachments||[]).length);
  if(withPics.length){
    sectionNo++;
    kids.push(heading(`${sectionNo}.  Photographs`));
    kids.push(caption("All photographs attached to remarks during the reporting period, grouped by PO. Photographs do not appear inline in the sections above."));
    const PG2 = F.GRID.photo;
    for(const p of vpos){
      const pics = [];
      withPics.filter(a=>a.po===p.po).forEach(a=>{
        const label = a.milestone ? `${a.item}  \u203A  ${a.milestone}` : (a.item || "PO level");
        (a.raw.attachments||[]).forEach(att => pics.push({att, label}));
      });
      if(!pics.length) continue;
      kids.push(new Paragraph({children:[T(poTitle(p),{bold:true,size:19,color:F.NAVY})],
        spacing:{before:160,after:80}, keepNext:true}));
      const prows = [];
      for(let i=0;i<pics.length;i+=2){
        const pair = pics.slice(i,i+2);
        prows.push(new TableRow({children:pair.concat(pair.length<2?[null]:[]).map((x,k)=>{
          if(!x) return cell(new Paragraph({children:[T("")]}), {width:{size:PG2[k],type:WidthType.DXA}});
          return cell([
            new Paragraph({children:[T("[ photograph ]",{size:17,color:F.CAP,italics:true})], alignment:CTR}),
            new Paragraph({children:[T(x.label,{size:17,color:F.FOOT})], alignment:CTR, spacing:{before:60}})
          ], {width:{size:PG2[k],type:WidthType.DXA}});
        })}));
      }
      kids.push(table(prows,PG2));
    }
  }

  /* final section — POs with nothing to report, listed once instead of as empty cards */
  if(quiet.length){
    sectionNo++;
    kids.push(heading(`${sectionNo}.  POs With No Updates`));
    kids.push(caption("POs with no comment, issue or critical update logged in the reporting period and no item movement. "+
      "Completed POs sit here once they stop moving. Listed for completeness rather than shown as empty blocks above."));
    const QG = F.GRID.card;
    const qrows = [ headRow([th("PO No.",QG[0]),th("Project Name",QG[1]),th("PO Qty",QG[2]),th("Delivered",QG[3]),
      th("Actual Completion",QG[4]),th("Expected Completion",QG[5]),th("Current Status",QG[6])]) ];
    quiet.forEach(p=> qrows.push(new TableRow({children:[
      td(p.po,QG[0],{run:{bold:true},align:CTR}), td(p.project,QG[1]),
      td(String(p.qTot),QG[2],{align:CTR}), td(String(p.qDel),QG[3],{align:CTR}),
      td(`${Math.round(p.act)}%`,QG[4],{align:CTR}), td(`${Math.round(p.exp)}%`,QG[5],{align:CTR}),
      td(SLAB[p.status]||"",QG[6],{align:CTR,
        run:{bold:true,color:VVR_STATUS[p.status]||VVR_STATUS.not_yet_started}})]})));
    kids.push(table(qrows,QG));
  }

  /* letterhead + footer */
  // transformation is in pixels (9525 EMU each). 119px wide matches the template's
  // letterhead; height follows this logo's own 4.03:1 ratio so nothing is squashed.
  const logo = new ImageRun({ data:b64bytes(VENWIZ_LOGO_B64), type:"png",
    transformation:{width:119, height:30} });
  const header = new Header({ children:[ new Paragraph({ children:[logo],
    border:{bottom:line(F.NAVY,10,4)}, spacing:{after:0} }) ]});
  const footer = new Footer({ children:[ new Paragraph({
    alignment:AlignmentType.RIGHT, border:{top:line(F.NAVY,6,4)},
    children:[ T("Page ",{size:17,color:F.FOOT}),
               new TextRun({children:[PageNumber.CURRENT], font:F.FONT, size:17, color:F.FOOT}),
               T(" of ",{size:17,color:F.FOOT}),
               new TextRun({children:[PageNumber.TOTAL_PAGES], font:F.FONT, size:17, color:F.FOOT}) ] }) ]});

  const doc = new Document({ sections:[{
    properties:{ page:{ size:{width:11906, height:16838},
      margin:{top:1180, right:850, bottom:900, left:850, header:420, footer:380} } },
    headers:{default:header}, footers:{default:footer},
    children:kids }]});
  return await Packer.toBlob(doc);
}

/* ================================================================ BOOT */
paint();
loadDump();
</script>
</body>
</html>
